<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>L.OSGraticule Demo</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<style type="text/css">
		html, body { width: 100%; height: 100%; margin: 0; }
		#map { width: 100%; height: 100%; }
	</style>
</head>

<body>
	<div id="map"></div>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.17.0/proj4.js"
            ></script>			
	<script type="text/javascript" src="L.OSGraticule.js"></script>

	<script type="text/javascript">

    var map = L.map('map',{
  		center: [53.4084, -2.9916],
  		zoom: 14,
  	});

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
      }).addTo(map);

	L.osGraticule({showCellLabels: true}).addTo(map);



	</script>
</body>
</html>
